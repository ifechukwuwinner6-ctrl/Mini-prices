<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Prices | Compare Smart</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 24px;
        }
        p.subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccd1d9;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #3498db;
        }
        button {
            padding: 12px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        .loading {
            text-align: center;
            display: none;
            color: #7f8c8d;
            font-weight: bold;
            margin: 20px 0;
        }
        .product-card {
            border: 1px solid #e6e9ed;
            border-radius: 10px;
            padding: 15px;
            background: #fff;
            margin-top: 15px;
        }
        .product-header {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }
        .product-image {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 6px;
            background: #f5f7fa;
        }
        .product-title {
            font-size: 16px;
            color: #2c3e50;
            font-weight: 600;
        }
        .deal-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-top: 1px dashed #e6e9ed;
        }
        .store-name {
            font-weight: bold;
            font-size: 15px;
        }
        .store-jumia { color: #f68b1e; }
        .store-jiji { color: #3bb371; }
        .price {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        .deal-link {
            padding: 6px 12px;
            background: #e1f5fe;
            color: #0288d1;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
        }
        .deal-link:hover {
            background: #0288d1;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mini-prices</h1>
    <p class="subtitle">Check items you need and find where to get them cheap</p>
    
    <div class="search-box">
        <input type="text" id="itemInput" placeholder="Type a product (e.g., phone, shoe)...">
        <button onclick="searchProduct()">Search</button>
    </div>

    <div id="loadingStatus" class="loading">Searching deals... Please wait...</div>
    <div id="resultsWrapper"></div>
</div>

<script>
function searchProduct() {
    const userInput = document.getElementById('itemInput').value.trim();
    const resultsWrapper = document.getElementById('resultsWrapper');
    const loadingStatus = document.getElementById('loadingStatus');
    
    if (!userInput) {
        alert("Please type something to search!");
        return;
    }
    
    // Show loading text and clear past results
    loadingStatus.style.display = 'block';
    resultsWrapper.innerHTML = '';
    
    // Connected directly to your live Render server!
    fetch('https://mini-prices-backend.onrender.com/search?item=' + encodeURIComponent(userInput))
        .then(response => response.json())
        .then(data => {
            loadingStatus.style.display = 'none';
            
            if (!data || data.length === 0 || data[0].name.includes("Not Found")) {
                resultsWrapper.innerHTML = `<div class='product-card' style='text-align:center; color:#e74c3c;'>No active matches found. Try checking another term!</div>`;
                return;
            }
            
            data.forEach(product => {
                resultsWrapper.innerHTML += `
                    <div class="product-card">
                        <div class="product-header">
                            <img class="product-image" src="${product.image}" alt="Product Image">
                            <h3 class="product-title">${product.name}</h3>
                        </div>
                        
                        <div class="deal-row">
                            <div>
                                <span class="store-name store-jumia">Jumia NGR</span>
                                <div class="price">₦ ${product.jumiaPrice}</div>
                            </div>
                            <a class="deal-link" href="${product.jumiaLink}" target="_blank">View on Jumia</a>
                        </div>
                        
                        <div class="deal-row">
                            <div>
                                <span class="store-name store-jiji">Jiji NGR</span>
                                <div class="price">${product.jijiPrice}</div>
                            </div>
                            <a class="deal-link" href="${product.jijiLink}" target="_blank">Compare on Jiji</a>
                        </div>
                    </div>
                `;
            });
        })
        .catch(error => {
            loadingStatus.style.display = 'none';
            resultsWrapper.innerHTML = `<div class='product-card' style='text-align:center; color:#e74c3c;'>Error linking to backend engine. Please check back shortly!</div>`;
            console.error("Error:", error);
        });
}
</script>

</body>
</html>
