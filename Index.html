<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Prices | Full-Screen Smart Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        body {
            background-color: #f4f4f5;
            color: #1c1c1e;
            padding-bottom: 50px;
            width: 100%;
        }

        /* Jiji Style Full Width Green Header Area */
        .main-header {
            background-color: #3bb371;
            padding: 16px;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            width: 100%;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 12px auto;
            padding: 0 8px;
        }

        .brand-logo {
            color: #ffffff;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            color: #e2fbe9;
            font-size: 13px;
            font-weight: 500;
        }

        /* Search Form Input Bar Container */
        .search-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 8px;
            padding: 0 8px;
        }

        .search-input {
            flex: 1;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            color: #000000;
            width: 100%;
        }

        .search-button {
            background-color: #3a165a;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Web Page Main Box Wrapper */
        .page-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            width: 100%;
        }

        .promo-banner {
            background: linear-gradient(135deg, #2e8b57, #3bb371);
            border-radius: 16px;
            padding: 20px;
            color: white;
            margin-bottom: 24px;
        }

        .promo-banner h2 {
            font-size: 20px;
            margin-bottom: 6px;
        }

        .layout-section {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .section-heading {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        /* Grid Framework Columns System */
        .jiji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 14px;
        }

        @media (max-width: 480px) {
            .jiji-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }

        /* Clickable Grid Layout Cards */
        .market-card {
            background: #ffffff;
            border: 1px solid #e5e5ea;
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .image-box {
            width: 100%;
            height: 120px;
            background-color: #f8f9fa;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            padding: 10px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: #3a3a3c;
        }

        .loader {
            text-align: center;
            display: none;
            color: #3bb371;
            font-weight: 700;
            padding: 40px 0;
            font-size: 18px;
        }

        .back-btn {
            background-color: #e5e5ea;
            color: #1c1c1e;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .product-item-box {
            border: 1px solid #e5e5ea;
            border-radius: 16px;
            padding: 16px;
            background: #ffffff;
            margin-top: 16px;
        }

        .comparison-row {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .view-deal-btn {
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            color: white;
            background-color: #3bb371;
        }
    </style>
</head>
<body>

<header class="main-header">
    <div class="header-top">
        <div class="brand-logo">Mini-prices</div>
        <div class="brand-subtitle">Smart Deal Finder</div>
    </div>
    <div class="search-container">
        <input type="text" id="itemInput" class="search-input" placeholder="What are you looking for today?">
        <button class="search-button" onclick="searchProduct('')">Search</button>
    </div>
</header>

<div class="page-wrapper">
    
    <div id="dashboardView">
        <div class="promo-banner">
            <h2>Compare Prices Live!</h2>
            <p>Click any category layout below to view items and see immediate cost comparisons.</p>
        </div>

        <div class="layout-section">
            <div class="section-heading">Trending Categories</div>
            
            <div class="jiji-grid">
                <div class="market-card" onclick="searchProduct('Laptops')">
                    <div class="image-box">
                        <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=400" alt="Laptops">
                    </div>
                    <div class="card-info"><div class="card-title">Laptops & Computers</div></div>
                </div>

                <div class="market-card" onclick="searchProduct('Shoes')">
                    <div class="image-box">
                        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" alt="Shoes">
                    </div>
                    <div class="card-info"><div class="card-title">Sneakers & Shoes</div></div>
                </div>

                <div class="market-card" onclick="searchProduct('Clothes')">
